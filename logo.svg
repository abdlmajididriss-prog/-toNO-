<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>

    <!-- Calendar Body Gradient -->
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0E233D"/>
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Checkmark Cyan Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Navy Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="3"/>

  <!-- Main Calendar Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Calendar Body -->
    <rect x="106" y="116" width="300" height="300" rx="44" fill="url(#calGrad)" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="4"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 106 160 C 106 135.7 125.7 116 150 116 L 362 116 C 386.3 116 406 135.7 406 160 L 406 200 L 106 200 Z" fill="url(#headerGrad)"/>

    <!-- Binder Rings -->
    <rect x="170" y="92" width="28" height="52" rx="14" fill="#E2E8F0" stroke="#0F2444" stroke-width="4"/>
    <rect x="314" y="92" width="28" height="52" rx="14" fill="#E2E8F0" stroke="#0F2444" stroke-width="4"/>

    <!-- Subtle Calendar Date Grid Dots -->
    <circle cx="168" cy="248" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="228" cy="248" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="288" cy="248" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="348" cy="248" r="10" fill="#38BDF8" fill-opacity="0.25"/>

    <circle cx="168" cy="304" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="228" cy="304" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="288" cy="304" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="348" cy="304" r="10" fill="#38BDF8" fill-opacity="0.25"/>

    <circle cx="168" cy="360" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="228" cy="360" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="288" cy="360" r="10" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="348" cy="360" r="10" fill="#38BDF8" fill-opacity="0.25"/>

    <!-- Dynamic Vibrant Checkmark -->
    <path d="M 160 295 L 225 360 L 375 195" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Four-Point Star at Top-Right -->
  <g transform="translate(385, 125)" filter="url(#glow)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="40" fill="#06B6D4" fill-opacity="0.3"/>
    
    <!-- 4-point star shape -->
    <path d="M 0 -36 Q 0 0 -36 0 Q 0 0 0 36 Q 0 0 36 0 Q 0 0 0 -36 Z" 
          fill="#E0F2FE"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Tiny accent sparkle -->
  <g transform="translate(135, 385)">
    <path d="M 0 -14 Q 0 0 -14 0 Q 0 0 0 14 Q 0 0 14 0 Q 0 0 0 -14 Z" 
          fill="#38BDF8" fill-opacity="0.7"/>
  </g>
</svg>
